<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - เที่ยวไหนดี สจล.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>ลืมรหัสผ่าน</h1>
            <p>เที่ยวไหนดี สจล.</p>
            <p>กรอกอีเมลที่ใช้สมัครสมาชิกเพื่อรับลิงก์ตั้งรหัสผ่านใหม่</p>

            <form id="forgotPasswordForm">
                <label for="email">อีเมล</label>
                <input
                    type="email"
                    id="email"
                    placeholder="กรอกอีเมลของคุณ"
                    required
                >

                <button type="submit" class="submit-btn">
                    ส่งลิงก์รีเซ็ตรหัสผ่าน
                </button>

                <p id="message"></p>
            </form>

            <div class="register-link">
                <a href="login.html">กลับไปเข้าสู่ระบบ</a>
            </div>
        </div>
    </div>
<script>
    document.getElementById("forgotPasswordForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message");
            const button = this.querySelector("button[type='submit']");

            button.disabled = true;
            message.textContent = "กำลังส่งคำขอ...";

            try {
                const response = await fetch("/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok && data.success === true) {
    alert(data.message);
    window.location.href = "/login.html";
    return;
}

message.textContent = data.message || "ส่งอีเมลไม่สำเร็จ กรุณาลองใหม่";

            } catch (error) {
                console.error("FORGOT PASSWORD ERROR:", error);
                message.textContent = "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่";
            } finally {
                button.disabled = false;
            }
        });
</script>
</body>
</html>
