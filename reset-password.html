<CodeBlock language="html" editable>
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - เที่ยวไหนดี สจล.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>ตั้งรหัสผ่านใหม่</h1>
            <p>เที่ยวไหนดี สจล.</p>
<form id="resetPasswordForm">
                <label for="password">รหัสผ่านใหม่</label>
                <input
                    type="password"
                    id="password"
                    minlength="8"
                    placeholder="อย่างน้อย 8 ตัวอักษร"
                    required
                >
<label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    placeholder="กรอกรหัสผ่านอีกครั้ง"
                    required
                >
<button type="submit" class="submit-btn">
                    เปลี่ยนรหัสผ่าน
                </button>
<p id="message"></p>
            </form>
<div class="register-link">
                <a href="login.html">กลับไปเข้าสู่ระบบ</a>
            </div>
        </div>
    </div>
<script>
        const form = document.getElementById("resetPasswordForm");
        const message = document.getElementById("message");
        const token = new URLSearchParams(window.location.search)
            .get("token");
form.addEventListener("submit", async function(event) {
            event.preventDefault();
const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;
            const button = form.querySelector("button[type='submit']");
if (!token) {
                message.textContent = "ไม่พบลิงก์รีเซ็ตรหัสผ่าน กรุณาขอลิงก์ใหม่";
                return;
            }
if (password.length < 8) {
                message.textContent = "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร";
                return;
            }
if (password !== confirmPassword) {
                message.textContent = "รหัสผ่านทั้งสองช่องไม่ตรงกัน";
                return;
            }
button.disabled = true;
            message.textContent = "กำลังเปลี่ยนรหัสผ่าน...";
try {
                const response = await fetch("/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token, password })
                });
const data = await response.json();
                message.textContent = data.message;

if (data.success) {
    alert("เปลี่ยนรหัสผ่านสำเร็จ กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่");
    window.location.href = "/login.html";
} else {
    button.disabled = false;
}

            } catch (error) {
                console.error(error);
                message.textContent = "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
</CodeBlock>
